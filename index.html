<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkyCast</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-slate-700 from-sky-400 to-indigo-600 text-white">
    <main class="mx-auto max-w-5xl px-6 py-10">
        <header>
            <div class="bg-slate-500 flex flex-col-2 md:flex-col-1 justify-between p-16">
                <div>
                    <h1 class="text-2xl font-bold text-2xl">SkyCast</h1>
                </div>
                <h1 class="text-6xl font-bold md:text-5xl">Weather Report</h1>
                <div class="flex flex-col gap-4">
                <button class="bg-slate-400 rounded-full hover:bg-slate-300" id="theme-toggle">Light/Dark</button>
                </div>
            </div>
            <div class="flex md:flex-col-1 justify-center m-4 mr-6">
                <form id="search-form">
                    <input class="bg-slate-400 rounded-xl" id="city-input" type="text" placeholder="Search a city..." />
                    <button id="search-button" type="submit">Search</button>
                </form>
            </div>
            <div class="flex gap-50">
                <div class="mb-4 absolute relative">
                    
                    <img class="rounded-full hover:scale-125" src="/assets/day.png" alt="Day picture">
                    
                    <ul class="bg-slate-400 rounded-xl p-1 list-inside space-y-2" id="temperature-list">
                        
                    </ul>
                    
                </div>
                <div class="bg-slate-400 rounded-full w-70 h-30 flex justify-center mt-20 md:w-90">
                    <h1 class="ml-8 mt-2">Favorite Cities:</h1>
                    <input class="border-0 outline-0" type="text" id="fav-input" placeholder="Enter your favorite city....">
                    
                    <ul class="" id="fav-list"></ul>
                </div>
                
                <div>
                    <img class="rounded-full hover:scale-125" src="/assets/night.png" alt="Night picture">
                    <ul class="bg-slate-400 rounded-xl p-1 list-inside space-y-2" id="temperature-night" id="fav-list">
                        
                    </ul>
                </div>
            </div>
        </header>
        <p id="status"></p>
        <section id="today"></section>
        <section>
             <h2>5-Day Forecast</h2>
             <p id="forescast-status"></p>
            <div  class="flex flex-col-5 mt-6 justify-center">
                
                   <div class="flex flex-col justify-center">

                    <img class=" h-100 w-50 object-cover hover:opacity-50 md:h-70 md:w-40" src="/assets/Screenshot 2026-11-02 135412.png">
                    
                    <ul id="day-1">
                         
                    </ul>
                    </div>
                    <div>
                    <img class=" h-100 w-50 object-cover hover:opacity-50 md:h-70 md:w-40" src="/assets/Screenshot 2026-11-02 135412.png">
                    <ul id="day-2">
                       
                    </ul>
                    </div>
                    <div>
                    <img class=" h-100 w-50 object-cover hover:opacity-50 md:h-70 md:w-40" src="/assets/Screenshot 2026-11-02 135412.png">
                    <ul id="day-3">
                       
                    </ul>
                    </div>
                    <div>
                    <img class=" h-100 w-50 object-cover hover:opacity-50 md:h-70 md:w-40" src="/assets/Screenshot 2026-11-02 135412.png">
                    <ul id="day-4">
                         
                    </ul>
                    </div>
                    <div>
                    <img class=" h-100 w-50 object-cover hover:opacity-50 md:h-70 md:w-40" src="/assets/Screenshot 2026-11-02 135412.png">
                    <ul id="day-5">
                        
                    </ul>
                    </div>
            </div>
        </section>
    </main>
    <script src="config.js"></script> <!-- must load first -->
    <script type="module" src="scripts.js"></script>
</body>

</htm
